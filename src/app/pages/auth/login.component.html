<div class="auth-wrapper">

  <div class="auth-card">

    <div class="auth-header">
      <h2 *ngIf="isLoginMode">Welcome Back</h2>
      <h2 *ngIf="!isLoginMode">Create Account</h2>

      <p *ngIf="isLoginMode">Login to your hotel dashboard</p>
      <p *ngIf="!isLoginMode">Register your hotel manager account</p>
    </div>

    <!-- LOGIN FORM -->
    <form *ngIf="isLoginMode" (ngSubmit)="login()" #loginForm="ngForm">

      <div class="input-group">
        <input type="email" placeholder="Email" [(ngModel)]="loginData.email" name="email" required email>
      </div>

      <div class="input-group">
        <input type="password" placeholder="Password" [(ngModel)]="loginData.password" name="password" required
          minlength="6">
      </div>

      <button class="primary-btn" [disabled]="loading || !loginForm.valid">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading">Please wait...</span>
      </button>

      <p class="switch-text">
        Don't have an account?
        <span (click)="toggleMode()">Register</span>
      </p>

    </form>


    <!-- REGISTER FORM -->
    <form *ngIf="!isLoginMode" (ngSubmit)="register()" #registerForm="ngForm">

      <div class="input-group">
        <input type="text" placeholder="Name" [(ngModel)]="registerData.name" name="name" required>
      </div>

      <div class="input-group">
        <input type="email" placeholder="Email" [(ngModel)]="registerData.email" name="email" required email>
      </div>

      <div class="input-group">
        <input type="password" placeholder="Password" [(ngModel)]="registerData.password" name="password" required
          minlength="6">
      </div>

      <button class="primary-btn" [disabled]="loading || !registerForm.valid">
        <span *ngIf="!loading">Register</span>
        <span *ngIf="loading">Creating...</span>
      </button>

      <p class="switch-text">
        Already have an account?
        <span (click)="toggleMode()">Login</span>
      </p>

    </form>

  </div>

</div>
