<!-- src/app/pages/super-admin/user-management/user-management.html -->

<div class="page">

  <!-- HEADER -->
  <div class="header">
    <h2>User Management</h2>
    <button class="add-btn" (click)="openForm()">+ Add User</button>
  </div>


<!-- ADD USER MODAL -->

<div class="modal-overlay" *ngIf="showForm">

  <div class="modal-card">

    <h3>Add Manager</h3>

    <input
      type="text"
      placeholder="Name"
      [(ngModel)]="newUser.name"
    />

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="newUser.email"
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="newUser.password"
    />

    <div class="modal-actions">

      <button class="save-btn" (click)="submitUser()">
        Save
      </button>

      <button class="cancel-btn" (click)="showForm=false">
        Cancel
      </button>

    </div>

  </div>

</div>


  <!-- SEARCH FILTER -->
  <div class="filter-card">

    <input
      type="text"
      placeholder="Search user..."
      [(ngModel)]="search"
    />

    <select [(ngModel)]="statusFilter">
      <option value="">All Status</option>
      <option value="true">Active</option>
      <option value="false">Inactive</option>
    </select>

    <button class="search-btn" (click)="applyFilters()">Search</button>

    <button class="clear-btn" (click)="clearFilters()">Clear</button>

  </div>

  <!-- USERS TABLE -->
  <div class="table-card">

    <table>

      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let user of filteredUsers">

          <td>{{user.name}}</td>
          <td>{{user.email}}</td>

          <td>
            <span class="role">
              {{user.role}}
            </span>
          </td>

          <td>
            <span
              class="status"
              [ngClass]="user.isActive ? 'active' : 'inactive'"
            >
              {{user.isActive ? 'Active' : 'Inactive'}}
            </span>
          </td>

          <td class="actions">

            <button class="edit-btn" (click)="editUser(user)">Edit</button>

            <button
              *ngIf="user.isActive"
              class="deactivate-btn"
              (click)="deactivateUser(user._id)"
            >
              Deactivate
            </button>

            <button
              *ngIf="!user.isActive"
              class="activate-btn"
              (click)="activateUser(user._id)"
            >
              Activate
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
