<div class="users-page">

  <!-- ================= HEADER ================= -->
  <div class="header">
    <h2>Staff Management</h2>

    <button class="btn primary" (click)="openAddModal()">
      + Add Staff
    </button>
  </div>

  <div class="filter-card">

  <div class="filter-bar">

    <input
      type="text"
      placeholder="Search staff..."
      [(ngModel)]="search"
    />

    <select [(ngModel)]="selectedRole">
      <option [ngValue]="null">All Roles</option>
      <option [ngValue]="Role.ADMIN">ADMIN</option>
      <option [ngValue]="Role.STAFF">STAFF</option>
    </select>

    <select [(ngModel)]="selectedStatus">
      <option [ngValue]="null">All Status</option>
      <option [ngValue]="true">Active</option>
      <option [ngValue]="false">Inactive</option>
    </select>

    <button class="btn primary" (click)="applyFilters()">
      Search
    </button>

    <button class="btn ghost" (click)="resetFilters()">
      Clear
    </button>

  </div>

</div>

  <!-- ================= LOADING STATE ================= -->
  <div *ngIf="loading" class="state">
    Loading staff...
  </div>

  <!-- ================= USERS TABLE ================= -->
  <div class="table-wrapper" *ngIf="!loading && users.length > 0">

    <table class="users-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th class="actions-col">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let user of users"
          [class.inactive-user]="!user.isActive"
        >
          <td class="name">
            {{ user.name }}
          </td>

          <td class="email">
            {{ user.email }}
          </td>

          <td>
            <span
              class="role-pill"
              [class.admin]="user.role === 'ADMIN'"
              [class.staff]="user.role === 'STAFF'"
            >
              {{ user.role }}
            </span>
          </td>

          <td>
            <span
              class="status-pill"
              [class.active]="user.isActive"
              [class.inactive]="!user.isActive"
            >
              {{ user.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>

          <td class="actions">
            <button
              class="btn ghost"
              (click)="openEditModal(user)"
            >
              Edit
            </button>

            <button
              class="btn warn"
              *ngIf="user.isActive"
              (click)="deactivateUser(user)"
            >
              Deactivate
            </button>

            <button
              class="btn success"
              *ngIf="!user.isActive"
              (click)="activateUser(user)"
            >
              Activate
            </button>
          </td>
        </tr>
              </tbody>
    </table>

  </div>

<!-- ================= PAGINATION ================= -->
<div class="pagination" *ngIf="totalPages > 1">

  <button
    class="btn ghost"
    (click)="prevPage()"
    [disabled]="currentPage === 1">
    Prev
  </button>

  <button
    *ngFor="let p of [].constructor(totalPages); let i = index"
    class="btn page"
    [class.active]="currentPage === i + 1"
    (click)="goToPage(i + 1)">
    {{ i + 1 }}
  </button>

  <button
    class="btn ghost"
    (click)="nextPage()"
    [disabled]="currentPage === totalPages">
    Next
  </button>

</div>

        <!-- EMPTY STATE -->
<div class="state" *ngIf="!loading && users.length === 0">
  No members found
</div>
</div>

<!-- ================= ADD / EDIT MODAL ================= -->
<div class="modal-backdrop" *ngIf="modalOpen">
  <div class="modal">

    <h3>
      {{ modalMode === 'add' ? 'Add Staff Member' : 'Edit Staff Member' }}
    </h3>

    <div class="form-group">
      <label>Name</label>
      <input
        type="text"
        placeholder="Full name"
        [(ngModel)]="form.name"
      />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        placeholder="Email address"
        [(ngModel)]="form.email"
      />
    </div>

    <div
      class="form-group"
      *ngIf="modalMode === 'add'"
    >
      <label>Password</label>
      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="form.password"
      />
    </div>

    <div class="form-group">
      <label>Role</label>
      <select [(ngModel)]="form.role">
        <option [ngValue]="Role.ADMIN">ADMIN</option>
        <option [ngValue]="Role.STAFF">STAFF</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn view" (click)="closeModal()">
        Cancel
      </button>

      <button
        class="btn primary"
        [disabled]="!form.name || !form.email"
        (click)="saveUser()"
      >
        {{ modalMode === 'add' ? 'Create Staff' : 'Update Staff' }}
      </button>
    </div>

  </div>
</div>

<!-- ================= TOAST ================= -->
<div class="toast" *ngIf="toast" [ngClass]="toast.type">
  {{ toast.message }}
</div>
